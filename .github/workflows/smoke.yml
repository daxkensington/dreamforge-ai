name: Smoke Tests

# Playwright smoke suite — exercises real user journeys (page rendering,
# auth gating, no broken images, no console errors, API health). Runs:
#   • against Vercel preview when a PR deploy completes
#   • nightly against prod (catches drift between deploys)
#   • on demand
#
# Designed to fail loud on regressions Sentry can't see: missing pages,
# missing assets, broken layouts, console errors that don't throw.

on:
  deployment_status:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC = 02:00 EDT — quiet hours
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to test (default: https://dreamforgex.ai)"
        required: false
        default: "https://dreamforgex.ai"
      expected_sha:
        description: "Exact deployed source SHA (defaults to the selected workflow revision)"
        required: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dreamforge-smoke-${{ github.event.deployment.sha || github.sha }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Skip deployment_status events that aren't successful preview deploys
    # or successful prod deploys. The expression on the schedule + dispatch
    # branches always passes; only filters deployment_status events.
    if: |
      github.event_name != 'deployment_status' ||
      github.event.deployment_status.state == 'success'
    steps:
      - name: Verify trusted repository source before credential use
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.deployment?.sha || context.sha;
            if (!/^[a-f0-9]{40}$/.test(sha)) throw new Error('Invalid exact source SHA');
            const repo = `${context.repo.owner}/${context.repo.repo}`;
            const branches = await github.rest.repos.listBranchesForHeadCommit({ ...context.repo, commit_sha: sha });
            if (!branches.data.length) throw new Error('Source is not the head of an owned repository branch');
            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({ ...context.repo, commit_sha: sha });
            if (prs.data.some(pr => pr.head?.repo?.full_name !== repo)) throw new Error('Fork source cannot use deployment credentials');
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Determine base URL
        id: base
        run: node scripts/smoke-workflow-target.mjs

      - name: Verify deployed source and app health
        env:
          BASE_URL: ${{ steps.base.outputs.url }}
          EXPECTED_DEPLOYMENT_SHA: ${{ steps.base.outputs.revision }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/check-smoke-target.mjs

      - name: Run Playwright smoke tests
        env:
          BASE_URL: ${{ steps.base.outputs.url }}
          EXPECTED_AUTH_ORIGIN: ${{ steps.base.outputs.auth_origin }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          CI: "true"
        run: |
          echo "🧪 Smoke testing $BASE_URL"
          pnpm test:smoke

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Record smoke failure
        if: failure()
        run: |
          echo '### DreamForge smoke failed' >> "$GITHUB_STEP_SUMMARY"
          echo 'Read the failed assertions and downloadable report/screenshots in this run. Protected-preview network traces are omitted to protect authorization cookies.' >> "$GITHUB_STEP_SUMMARY"
