name: Smoke Tests

# Playwright smoke suite — exercises real user journeys (page rendering,
# auth gating, no broken images, no console errors, API health). Runs:
#   • after a successful PRODUCTION deploy — tested at https://dreamforgex.ai
#   • after a successful PREVIEW deploy, but ONLY when the repo secret
#     VERCEL_AUTOMATION_BYPASS_SECRET is set (previews are behind Vercel SSO;
#     without the bypass every request gets the Vercel login page). With no
#     secret, preview deploy events are skipped instead of failing.
#   • nightly against prod (catches drift between deploys)
#   • on demand
#
# Designed to fail loud on regressions Sentry can't see: missing pages,
# missing assets, broken layouts, console errors that don't throw.

on:
  deployment_status:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC = 02:00 EDT — quiet hours
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to test (default: https://dreamforgex.ai)"
        required: false
        default: "https://dreamforgex.ai"

jobs:
  smoke:
    runs-on: ubuntu-latest
    # Skip deployment_status events that aren't successful preview deploys
    # or successful prod deploys. The expression on the schedule + dispatch
    # branches always passes; only filters deployment_status events.
    if: |
      github.event_name != 'deployment_status' ||
      github.event.deployment_status.state == 'success'
    env:
      BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Determine base URL
        id: base
        env:
          EVENT: ${{ github.event_name }}
          DEPLOY_ENV: ${{ github.event.deployment.environment }}
          TARGET_URL: ${{ github.event.deployment_status.target_url }}
          INPUT_URL: ${{ github.event.inputs.base_url }}
        run: |
          url="https://dreamforgex.ai"
          run="true"
          if [ "$EVENT" = "deployment_status" ]; then
            if [ "$DEPLOY_ENV" = "Production" ] || [ "$DEPLOY_ENV" = "production" ]; then
              # target_url is the SSO-protected *.vercel.app deployment URL;
              # the production deploy is served at the custom domain.
              url="https://dreamforgex.ai"
            elif [ -n "$BYPASS" ]; then
              url="$TARGET_URL"
            else
              echo "Preview deploy ($DEPLOY_ENV) is SSO-protected and no VERCEL_AUTOMATION_BYPASS_SECRET is set — skipping."
              run="false"
            fi
          elif [ "$EVENT" = "workflow_dispatch" ] && [ -n "$INPUT_URL" ]; then
            url="$INPUT_URL"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.base.outputs.run == 'true'
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}

      - uses: actions/setup-node@v4
        if: steps.base.outputs.run == 'true'
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        if: steps.base.outputs.run == 'true'
        with:
          version: 10.4.1

      - name: Install dependencies
        if: steps.base.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        if: steps.base.outputs.run == 'true'
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Run Playwright smoke tests
        if: steps.base.outputs.run == 'true'
        env:
          BASE_URL: ${{ steps.base.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          CI: "true"
        run: |
          echo "🧪 Smoke testing $BASE_URL"
          pnpm test:smoke

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14

      - name: Comment on PR if smoke failed
        if: failure() && github.event_name == 'deployment_status' && github.event.deployment.environment != 'production'
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.deployment.sha;
            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: sha,
            });
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            for (const pr of prs.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: [
                  `❌ **Smoke tests failed on preview deploy**`,
                  ``,
                  `Preview: ${context.payload.deployment_status.target_url}`,
                  `Run: ${runUrl}`,
                  ``,
                  `Download the Playwright report from the run artifacts to see screenshots and traces.`,
                ].join("\n"),
              });
            }
