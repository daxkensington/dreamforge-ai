name: Link Check (PR Preview)

# Runs when Vercel finishes deploying a PR preview, then checks every link
# and asset against the preview URL. Fails the PR check if anything 404s,
# so broken links never make it to main.

on:
  deployment_status:

permissions:
  contents: read
  pull-requests: read

jobs:
  check-preview:
    # Only run for successful Vercel preview deploys (skip prod, skip failures).
    if: |
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment != 'production' &&
      github.event.deployment_status.target_url != ''
    runs-on: ubuntu-latest
    steps:
      - name: Verify trusted repository source before credential use
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.deployment?.sha || context.sha;
            if (!/^[a-f0-9]{40}$/.test(sha)) throw new Error('Invalid exact source SHA');
            const repo = `${context.repo.owner}/${context.repo.repo}`;
            const branches = await github.rest.repos.listBranchesForHeadCommit({ ...context.repo, commit_sha: sha });
            if (!branches.data.length) throw new Error('Source is not the head of an owned repository branch');
            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({ ...context.repo, commit_sha: sha });
            if (prs.data.some(pr => pr.head?.repo?.full_name !== repo)) throw new Error('Fork source cannot use deployment credentials');
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check links + assets against preview
        env:
          BASE_URL: ${{ github.event.deployment_status.target_url }}
          EXPECTED_DEPLOYMENT_SHA: ${{ github.event.deployment.sha }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          echo "🔍 Preview URL: $BASE_URL"
          node scripts/check-links.mjs

      - name: Record preview link failure
        if: failure()
        run: |
          echo '### DreamForge preview link check failed' >> "$GITHUB_STEP_SUMMARY"
          echo 'Read the app/source preflight or broken route/asset assertions in this run.' >> "$GITHUB_STEP_SUMMARY"
