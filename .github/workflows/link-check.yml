name: Link Check

# Runs after Vercel finishes deploying so we check the live build, not source.
# Catches 404s on internal hrefs that Sentry cannot detect (a 404 is a valid
# HTTP response, not an exception — Sentry only sees thrown errors).

on:
  # Run after every push to main (Vercel deploys ~3min after push, so we wait).
  push:
    branches: [main]
  # Allow manual runs.
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to check (default: https://dreamforgex.ai)"
        required: false
        default: "https://dreamforgex.ai"
      expected_sha:
        description: "Exact deployed source SHA (defaults to selected workflow revision)"
        required: false
  # Daily sweep — catches drift even when no commits land.
  schedule:
    - cron: "0 14 * * *" # 14:00 UTC = 10:00 AM EDT

permissions:
  contents: read
  pull-requests: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - name: Verify trusted repository source before credential use
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.deployment?.sha || context.sha;
            if (!/^[a-f0-9]{40}$/.test(sha)) throw new Error('Invalid exact source SHA');
            const repo = `${context.repo.owner}/${context.repo.repo}`;
            const branches = await github.rest.repos.listBranchesForHeadCommit({ ...context.repo, commit_sha: sha });
            if (!branches.data.length) throw new Error('Source is not the head of an owned repository branch');
            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({ ...context.repo, commit_sha: sha });
            if (prs.data.some(pr => pr.head?.repo?.full_name !== repo)) throw new Error('Fork source cannot use deployment credentials');
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Wait for Vercel to finish deploying the push that triggered us.
      # Skip the wait on manual / scheduled runs.
      - name: Wait for Vercel deploy
        if: github.event_name == 'push'
        run: sleep 240

      - name: Check internal links
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'https://dreamforgex.ai' }}
          EXPECTED_DEPLOYMENT_SHA: ${{ github.event.inputs.expected_sha || github.sha }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/check-links.mjs
