name: Build & publish RunPod worker image

on:
  push:
    branches: [main]
    paths:
      - "runpod-worker/**"
      - ".github/workflows/runpod-worker-build.yml"
  # Allow manual re-run from the Actions tab.
  workflow_dispatch: {}

concurrency:
  group: runpod-worker-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Publishes to dreamforge-worker2, NOT dreamforge-worker: the original
      # package was created by a manual docker push, so it isn't linked to
      # this repo and GITHUB_TOKEN gets 403 on it (this is why the 2026-04-20
      # build failed and the soundfile fix never shipped). A new package name
      # is auto-created and repo-linked on first push. RunPod's stored ghcr
      # registry auth is a user PAT, so it can pull the new package too.
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ./runpod-worker
          file: ./runpod-worker/Dockerfile
          push: true
          tags: |
            ghcr.io/daxkensington/dreamforge-worker2:latest
            ghcr.io/daxkensington/dreamforge-worker2:${{ github.sha }}
          # Build caching keeps rebuild time down on small changes.
          cache-from: type=registry,ref=ghcr.io/daxkensington/dreamforge-worker2:buildcache
          cache-to: type=registry,ref=ghcr.io/daxkensington/dreamforge-worker2:buildcache,mode=max
          # The image has CUDA bits so linux/amd64 only — RunPod runs on x86 GPUs.
          platforms: linux/amd64

      - name: Summary
        run: |
          echo "### RunPod worker image published" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/daxkensington/dreamforge-worker2:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/daxkensington/dreamforge-worker2:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next step:** update the RunPod template imageName to \`dreamforge-worker2:latest\` (or the SHA tag) so workers pull the new image." >> $GITHUB_STEP_SUMMARY
